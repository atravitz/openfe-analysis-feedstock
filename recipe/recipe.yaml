schema_version: 1

context:
  python_min: "3.11"
  name: openfe-analysis
  version: "0.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/OpenFreeEnergy/openfe_analysis/archive/refs/tags/v${{ version }}.tar.gz
  sha256: fa8f90c05584d0dd3e7c4b7d446abe59bb1fcf33403443118eee478378822985

build:
  number: 0
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} ${{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools_scm
  run:
    - MDAnalysis >=2.8.0
    - matplotlib-base
    - click
    - netCDF4
    - openff-units
    - python >=${{ python_min }}
    - tqdm
    - pyyaml
    - rdkit
    - spyrmsd

tests:
  - python:
      imports:
        - openfe_analysis
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Analysis tools for the openfe ecosystem
  description: |
    openfe-analysis is a set of analysis tools to check the
    health of free energy calculations in the openfe ecosystem.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/OpenFreeEnergy/openfe_analysis
  repository: https://github.com/OpenFreeEnergy/openfe_analysis
  documentation: https://github.com/OpenFreeEnergy/openfe_analysis

extra:
  recipe-maintainers:
    - dwhswenson
    - ialibay
    - mikemhenry
    - atravitz
    - hannahbaumann
